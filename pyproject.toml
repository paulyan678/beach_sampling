[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beach-sampling-rl"
version = "0.1.0"
description = "Reproducible Bayesian deep-RL benchmark for autonomous beach microplastic sampling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Paul Yan"}]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.3,<3",
  "matplotlib>=3.8,<4",
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
xbeach = ["xarray>=2024.1", "netCDF4>=1.6"]

[project.scripts]
beach-rl = "beach_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

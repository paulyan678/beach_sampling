name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: pytest
      - name: End-to-end CPU smoke study
        run: beach-rl study --config configs/smoke.yaml --output runs/ci-smoke

      - name: Regenerate archived dense statistics
        run: python -m beach_rl.artifacts report --episodes results/research/episodes.csv --output runs/regenerated-dense
